name: Road Safety AI checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Compile Python modules
        run: python -m py_compile app/app.py app/core.py setup_models.py validate_project.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
